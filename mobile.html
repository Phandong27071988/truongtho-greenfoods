<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giao diện Mobile - Trường Thọ Greenfoods</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; margin: 0; background: #fff; }
    header { background: #2e7d32; color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; }
    .logo img { height: 36px; margin-right: 10px; }
    .menu-toggle { font-size: 24px; cursor: pointer; }
    .banner img { width: 100%; display: block; }
    .category-bar { display: flex; overflow-x: auto; background: #f1f8e9; padding: 10px 0; }
    .category-bar div { flex: 0 0 auto; text-align: center; margin: 0 10px; font-size: 14px; color: #2e7d32; }
    .category-bar img { width: 40px; height: 40px; margin: 0 auto 6px; }
    .product-list { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px 10px; }
    .product { border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; text-align: center; background: #fff; }
    .product img { width: 100%; border-radius: 6px; }
    .product-name { margin: 10px 0 5px; font-weight: bold; color: #33691e; }
    .product-price { color: #d84315; }
    .floating-buttons { position: fixed; bottom: 20px; right: 15px; display: flex; flex-direction: column; gap: 10px; }
    .floating-buttons a { width: 48px; height: 48px; border-radius: 50%; background: #2e7d32; display: flex; justify-content: center; align-items: center; text-decoration: none; color: #fff; font-size: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="assets/images/logo.png" alt="Logo">
    <strong>Greenfoods</strong>
  </div>
  <div class="menu-toggle">&#9776;</div>
</header>

<div class="banner">
  <img src="assets/images/headquarters.png" alt="Banner">
</div>

<div class="category-bar">
  <div><img src="assets/images/dau-lac.png" alt="Dầu lạc">Dầu lạc</div>
  <div><img src="assets/images/mat-ong.png" alt="Mật ong">Mật ong</div>
  <div><img src="assets/images/thit-chua.png" alt="Thịt chua">Thịt chua</div>
  <div><img src="assets/images/mit-say.png" alt="Mít sấy">Mít sấy</div>
</div>

<div class="product-list">
  <div class="product">
    <img src="assets/images/dau-lac.png" alt="Dầu lạc">
    <div class="product-name">Dầu lạc 1L</div>
    <div class="product-price">170.000đ</div>
  </div>
  <div class="product">
    <img src="assets/images/mat-ong.png" alt="Mật ong">
    <div class="product-name">Mật ong 1L</div>
    <div class="product-price">180.000đ</div>
  </div>
  <div class="product">
    <img src="assets/images/thit-chua.png" alt="Thịt chua">
    <div class="product-name">Thịt chua 250g</div><div class="product-price">50.000đ</div>
  </div>
  <div class="product">
    <img src="assets/images/mit-say.png" alt="Mít sấy">
    <div class="product-name">Mít sấy 250g</div>
    <div class="product-price">60.000đ</div>
  </div>
</div>

<div class="floating-buttons">
  <a href="tel:0862985341" title="Gọi ngay">📞</a>
  <a href="https://zalo.me/129335761504826166" title="Zalo">Z</a>
</div>

</body>
</html>
