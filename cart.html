
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Giỏ hàng - Trường Thọ Greenfoods</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .cart-container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 6px;
    }
    .cart-container h2 {
      margin-bottom: 20px;
      color: #33691e;
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
    }
    .cart-table th, .cart-table td {
      border-bottom: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    .cart-table th {
      background: #f1f8e9;
    }
    .total {
      text-align: right;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #d84315;
    }
    .checkout-btn {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 16px;
      background: #4caf50;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
    }
    .checkout-btn:hover {
      background: #388e3c;
    }
    .empty-msg {
      text-align: center;
      margin-top: 40px;
      color: #888;
    }
  </style>
</head>
<body>

<div class="cart-container">
  <h2>Giỏ hàng của bạn</h2>
  <table class="cart-table" id="cartTable">
    <thead>
      <tr>
        <th>Sản phẩm</th>
        <th>Giá</th>
        <th>Số lượng</th>
        <th>Thành tiền</th>
        <th>Xóa</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="emptyCartMsg" class="empty-msg" style="display:none;">Giỏ hàng đang trống.</div>
  <div class="total" id="cartTotal">Tổng: 0đ</div>
  <a href="checkout.html" class="checkout-btn">Tiến hành đặt hàng</a>
</div>

<script>
  function loadCart() {
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const tbody = document.querySelector("#cartTable tbody");
    const totalEl = document.getElementById("cartTotal");
    const emptyMsg = document.getElementById("emptyCartMsg");
    tbody.innerHTML = "";

    if (cart.length === 0) {
      emptyMsg.style.display = "block";
      totalEl.style.display = "none";
      return;
    }

    let total = 0;
    cart.forEach((item, index) => {
      const row = document.createElement("tr");
      const itemTotal = item.price * item.quantity;
      total += itemTotal;

      row.innerHTML = `
        <td>${item.name}</td>
        <td>${item.price.toLocaleString()}đ</td>
        <td>${item.quantity}</td>
        <td>${itemTotal.toLocaleString()}đ</td>
        <td><button onclick="removeItem(${index})">X</button></td>
      `;
      tbody.appendChild(row);
    });

    totalEl.innerText = "Tổng: " + total.toLocaleString() + "đ";
  }

  function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
  }

  document.addEventListener("DOMContentLoaded", loadCart);
</script>

</body>
</html>
