
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt hàng - Trường Thọ Greenfoods</title>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-E5XQ7QE5FY"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .checkout-container {
      max-width: 700px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #b71c1c;
    }
    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 4px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    textarea { resize: vertical; }
    button {
      margin-top: 20px;
      width: 100%;
      background: #c30000;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #9f0000;
    }
    .summary {
      margin-top: 30px;
      background: #f5f5f5;
      padding: 15px;
      border-left: 4px solid #c30000;
    }
    .summary h3 {
      margin-bottom: 10px;
      color: #c30000;
    }
    .summary p {
      margin-bottom: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="checkout-container">
  <h2>Thông tin đặt hàng</h2>
  <form id="orderForm">
    <label for="name">Họ và tên *</label>
    <input type="text" id="name" required>

    <label for="email">Email *</label>
    <input type="email" id="email" required>

    <label for="phone">Số điện thoại *</label>
    <input type="tel" id="phone" required>

    <label for="address">Địa chỉ chi tiết *</label>
    <input type="text" id="address" required>

    <label for="province">Tỉnh / Thành phố *</label>
    <input type="text" id="province" required>

    <label for="district">Quận / Huyện *</label>
    <input type="text" id="district" required>

    <label for="note">Ghi chú đơn hàng</label>
    <textarea id="note" rows="3"></textarea>

    <label>Hình thức thanh toán</label>
    <input type="text" value="Thanh toán khi nhận hàng (COD)" disabled>

    <button type="submit">Xác nhận đặt hàng</button>
  </form>

  <div class="summary" id="orderSummary" style="display:none;">
    <h3>Đơn hàng của bạn</h3>
    <div id="summaryContent"></div>
  </div>
</div>

<script>
  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    if (cart.length === 0) {
      alert("Giỏ hàng của bạn đang trống.");
      return;
    }

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const province = document.getElementById("province").value.trim();
    const district = document.getElementById("district").value.trim();
    const note = document.getElementById("note").value.trim();

    let summary = document.getElementById("summaryContent");
    summary.innerHTML = "";
    let total = 0;

    cart.forEach(item => {
      const itemTotal = item.price * item.quantity;
      total += itemTotal;
      summary.innerHTML += `<p>${item.name} x ${item.quantity} = ${itemTotal.toLocaleString()}đ</p>`;
    });

    summary.innerHTML += `
      <p><strong>Tổng cộng: ${total.toLocaleString()}đ</strong></p>
      <p>Khách hàng: ${name}</p>
      <p>SĐT: ${phone}</p>
      <p>Email: ${email}</p>
      <p>Địa chỉ: ${address}, ${district}, ${province}</p>
      <p>Ghi chú: ${note || "Không có"}</p>
      <p>Thanh toán: Thanh toán khi nhận hàng (COD)</p>
    `;

    document.getElementById("orderSummary").style.display = "block";
    localStorage.removeItem("cart");
  });
</script>

</body>
</html>
