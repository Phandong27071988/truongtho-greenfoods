
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt hàng - Trường Thọ Greenfoods</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f1f8e9; padding: 20px; }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 20px 24px;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #33691e;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    textarea { resize: vertical; }
    button {
      margin-top: 20px;
      background: #4caf50;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    button:hover {
      background: #388e3c;
    }
    .summary {
      margin-top: 30px;
      background: #e8f5e9;
      padding: 15px;
      border-radius: 4px;
      border: 1px dashed #81c784;
    }
    .summary h4 {
      margin-bottom: 10px;
      color: #2e7d32;
    }
    .summary ul {
      list-style: none;
      padding-left: 0;
    }
    .summary li {
      margin-bottom: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Thông tin đặt hàng</h2>
  <form id="orderForm">
    <label for="name">Họ và tên *</label>
    <input type="text" id="name" required>

    <label for="email">Email *</label>
    <input type="email" id="email" required>

    <label for="phone">Số điện thoại *</label>
    <input type="tel" id="phone" required>

    <label for="address">Địa chỉ chi tiết *</label>
    <input type="text" id="address" required>

    <label for="province">Tỉnh / Thành phố *</label>
    <input type="text" id="province" required>

    <label for="district">Quận / Huyện *</label>
    <input type="text" id="district" required>

    <label for="note">Ghi chú</label>
    <textarea id="note" rows="3"></textarea>

    <label>Hình thức thanh toán</label>
    <input type="text" value="Giao hàng thu tiền (COD)" disabled>

    <button type="submit">Xác nhận đặt hàng</button>
  </form>

  <div class="summary" id="orderSummary" style="display:none;">
    <h4>Đơn hàng của bạn</h4>
    <ul id="summaryList"></ul>
  </div>
</div>

<script>
  document.getElementById("orderForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    if (cart.length === 0) {
      alert("Giỏ hàng đang trống. Vui lòng quay lại chọn sản phẩm.");
      return;
    }

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const province = document.getElementById("province").value.trim();
    const district = document.getElementById("district").value.trim();
    const note = document.getElementById("note").value.trim();

    const orderList = document.getElementById("summaryList");
    orderList.innerHTML = "";

    let total = 0;
    cart.forEach(item => {
      const li = document.createElement("li");
      const sub = item.price * item.quantity;
      total += sub;
      li.innerText = `${item.name} x${item.quantity} = ${sub.toLocaleString()}đ`;
      orderList.appendChild(li);
    });

    orderList.innerHTML += `
      <li><strong>Tổng cộng: ${total.toLocaleString()}đ</strong></li>
      <li>Khách hàng: ${name}</li>
      <li>SĐT: ${phone}</li>
      <li>Email: ${email}</li>
      <li>Địa chỉ: ${address}, ${district}, ${province}</li>
      <li>Ghi chú: ${note || "Không có"}</li>
      <li>Thanh toán: Giao hàng thu tiền (COD)</li>
    `;

    document.getElementById("orderSummary").style.display = "block";
    localStorage.removeItem("cart");
  });
</script>

</body>
</html>
